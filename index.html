<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beflame Home | Handcrafted Beeswax Candles</title>

    <meta name="description"
        content="Handcrafted beeswax candles made from 100% pure Australian beeswax with natural cotton wicks.">

    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>

    <main>

        <section class="hero">

            <div class="container">

                <!-- Left Content -->

                <div class="hero__content">

                    <a href="index.html"
                        class="logo"
                        aria-label="Beflame Home">

                        <img
                            src="images/logo.svg"
                            alt="Beflame Home">

                    </a>

                    <h1 class="hero__title">
                        Handcrafted Beeswax Candles
                    </h1>

                    <p class="hero__text">
                        Made from 100% pure Australian beeswax with natural cotton wicks.
                        Clean-burning with a delicate natural honey aroma.
                    </p>

                    <div class="hero__buttons">

                        <a href="https://beflamecandles.etsy.com"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn btn--primary">

                            Shop on Etsy

                        </a>

                        <a href="mailto:oksanadiachenko9@gmail.com?subject=Wholesale%20Enquiry"
                            class="btn btn--secondary">

                            Wholesale

                        </a>

                    </div>

                </div>

                <!-- Right Image -->

                <div class="hero__image">

                    <img
                        src="images/hero-image.jpg"
                        alt="Handcrafted beeswax candles made from pure Australian beeswax"
                        loading="eager">

                </div>

            </div>

            <!-- Social -->

            <nav class="social-links"
                aria-label="Social media">

                <a href="https://www.facebook.com/oksana.diach/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Facebook">

                    <img
                        src="icons/facebook.svg"
                        alt=""
                        loading="lazy">

                </a>

                <a href="https://www.instagram.com/beflamehome/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram">

                    <img
                        src="icons/instagram.svg"
                        alt=""
                        loading="lazy">

                </a>

                <a href="https://www.pinterest.com/beflamehome/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Pinterest">

                    <img
                        src="icons/pinterest.svg"
                        alt=""
                        loading="lazy">

                </a>

            </nav>

        </section>

    </main>

</body>

</html>
